<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Life in Months - Interactive</title>
  <meta name="description" content="Enter your date of birth, to see your life in months. Based on the post by Tim Urban, from Wait by Why.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="months-favicon.png" sizes="32x32">
  <link rel="stylesheet" href="your-life.css">
</head>
<body>
  <div class="title-box">
    <h1 class="title">Your Life in <label for="unitbox" class="unitbox-label visuallyhidden">Months</label></h1>
    <select name="unitbox" class="unitbox" id="unitbox" required>
      <option value="years">Years</option>
      <option value="months" selected>Months</option>
      <option value="weeks">Weeks</option>
    </select>
  </div>
  <form class="dob" action="#">
    <p class="instruction"><span class="print-hide">Enter your </span>Date of Birth</p>
    <label for="month" class="visuallyhidden">Month</label>
    <select name="month" class="month" id="month" required>
      <option value="0">January</option>
      <option value="1">February</option>
      <option value="2">March</option>
      <option value="3">April</option>
      <option value="4">May</option>
      <option value="5">June</option>
      <option value="6">July</option>
      <option value="7">August</option>
      <option value="8">September</option>
      <option value="9">October</option>
      <option value="10">November</option>
      <option value="11">December</option>
    </select>
    <label for="day" class="visuallyhidden">Day</label>
    <input type="text" class="day" id="day" placeholder="31" pattern="\d{0,2}" required/>
    <label for="year" class="visuallyhidden">Year</label>
    <input type="text" class="year" id="year" placeholder="1999" pattern="\d{4}" required/>
  </form>

  <div class="controls-container">
    <div class="target-year-box">
      <div class="control-group">
        <label for="lifespan" class="target-year-label">Tuổi thọ dự kiến</label>
        <input type="text" class="target-year" id="lifespan" placeholder="90" pattern="\d{1,3}" required />
      </div>
      <div class="control-group">
        <label for="targetYear" class="target-year-label">Đếm đến năm</label>
        <input type="text" class="target-year" id="targetYear" placeholder="2026" pattern="\d{4}" />
      </div>
    </div>

    <div class="milestone-panel">
      <h3>Cột mốc cuộc đời</h3>
      <form class="milestone-form" id="milestoneForm" onsubmit="return false;">
        <input type="text" class="milestone-title-input" id="milestoneTitle" placeholder="Tên cột mốc (ví dụ: Kết hôn 💍)" required />
        <input type="text" class="milestone-age-input" id="milestoneAge" placeholder="Tuổi" pattern="\d{1,3}" required />
        <select class="milestone-color-select" id="milestoneColor">
          <option value="#f59e0b">Vàng kim</option>
          <option value="#ef4444">Đỏ</option>
          <option value="#3b82f6">Xanh lam</option>
          <option value="#10b981">Xanh lục</option>
          <option value="#8b5cf6">Tím</option>
          <option value="#ec4899">Hồng</option>
        </select>
        <button type="submit" class="milestone-add-btn" id="milestoneAddBtn">Thêm</button>
      </form>
      <div class="milestone-list" id="milestoneList">
        <!-- Dynamic milestones list -->
      </div>
    </div>
  </div>

  <div class="stats-container">
    <div class="stats-grid">
      <div class="stats-card">
        <div class="stats-value" id="statsPercentVal">--</div>
        <div class="stats-label">Đã đi qua</div>
      </div>
      <div class="stats-card">
        <div class="stats-value" id="statsLivedVal">--</div>
        <div class="stats-label">Đã sống</div>
      </div>
      <div class="stats-card">
        <div class="stats-value" id="statsRemainingVal">--</div>
        <div class="stats-label">Còn lại</div>
      </div>
      <div class="stats-card">
        <div class="stats-value" id="statsPreciseAgeVal">--</div>
        <div class="stats-label">Tuổi hiện tại</div>
      </div>
    </div>
    <div class="progress-outer">
      <div class="progress-inner" id="statsProgressBar"></div>
    </div>
  </div>

  <ol class="chart months group">
  </ol>
  <div class="credits">
    <p>Based on the <a href="http://waitbutwhy.com/2014/05/life-weeks.html">Your Life in Weeks</a> post by Tim Urban, from <a href="http://waitbutwhy.com/">Wait But Why</a>.</p>
    <p class="print-hide"><a href="https://github.com/bryanbraun/your-life">See the code on Github.</a></p>
    <p class="print-hide"><a href="javascript:window.print()">Print this page.</a></p>
  </div>
  <script src="your-life.js"></script>
</body>
</html>
